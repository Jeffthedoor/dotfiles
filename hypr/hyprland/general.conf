# MONITOR CONFIG

# dock
monitor=eDP-1,preferred,auto,1

monitor=desc:Samsung Electric Company S27F350 H4ZH902060,preferred,auto-left, 0.75
monitor=desc:Dell Inc. DELL P2217 G58F584L0XQB,preferred,auto-left, 0.75, transform, 1

source=~/.config/hypr/hyprland/auto-mon.conf

workspace=1,monitor:eDP-1
workspace=2,monitor:eDP-1
workspace=3,monitor:eDP-1
workspace=4,monitor:eDP-1
workspace=5,monitor:eDP-1

workspace=6,monitor:desc:Samsung Electric Company S27F350 H4ZH902060
workspace=7,monitor:desc:Samsung Electric Company S27F350 H4ZH902060
workspace=8,monitor:desc:Samsung Electric Company S27F350 H4ZH902060
workspace=9,monitor:desc:Samsung Electric Company S27F350 H4ZH902060
workspace=10,monitor:desc:Samsung Electric Company S27F350 H4ZH902060

workspace=11,monitor:desc:Dell Inc. DELL P2217 G58F584L0XQB
workspace=12,monitor:desc:Dell Inc. DELL P2217 G58F584L0XQB
workspace=13,monitor:desc:Dell Inc. DELL P2217 G58F584L0XQB
workspace=14,monitor:desc:Dell Inc. DELL P2217 G58F584L0XQB
workspace=15,monitor:desc:Dell Inc. DELL P2217 G58F584L0XQB

input {
    kb_layout = us
    numlock_by_default = true
    repeat_delay = 250
    repeat_rate = 35

    touchpad {
        natural_scroll = yes
        disable_while_typing = false
        clickfinger_behavior = true
        scroll_factor = 0.5
        tap-to-click = true
    }

    # scroll_factor = 0

    special_fallthrough = true
    follow_mouse = 1
}

binds {
    scroll_event_delay = 0
}

gestures {
    gesture = 3, horizontal, workspace
    gesture = 3, vertical, special
    workspace_swipe_distance = 700
    workspace_swipe_cancel_ratio = 0.2
    workspace_swipe_min_speed_to_force = 5
    workspace_swipe_direction_lock = true
    workspace_swipe_direction_lock_threshold = 10
    workspace_swipe_create_new = true
}

general {
    # Gaps and border
    gaps_in = 4
    gaps_out = 5
    gaps_workspaces = 50
    border_size = 1

    # Fallback colors
    col.active_border = rgba(0DB7D4FF)
    col.inactive_border = rgba(31313600)

    resize_on_border = true
    no_focus_fallback = true
    layout = dwindle

    #focus_to_other_workspaces = true # ahhhh i still haven't properly implemented this
    allow_tearing = false # some guy told me tearing might make things smoother idk
}

dwindle {
	preserve_split = true
        # no_gaps_when_only = 1
	smart_split = false
	smart_resizing = false
}

decoration {
    rounding = 20

    blur {
        enabled = false
        xray = true
        special = false
        new_optimizations = true
        size = 5
        passes = 4
        brightness = 1
        noise = 0.01
        contrast = 1
    }
    # Shadow
    shadow:enabled = false;

    # Shader
    # screen_shader = ~/.config/hypr/shaders/nothing.frag
    # screen_shader = ~/.config/hypr/shaders/vibrance.frag

    # Dim
    dim_inactive = false
    dim_strength = 0.1
    dim_special = 0
}

animations {
    enabled = true
    # Animation curves

    bezier = linear, 0, 0, 1, 1
    bezier = md3_standard, 0.2, 0, 0, 1
    bezier = md3_decel, 0.05, 0.7, 0.1, 1
    bezier = md3_accel, 0.3, 0, 0.8, 0.15
    bezier = overshot, 0.05, 0.9, 0.1, 1.1
    bezier = crazyshot, 0.1, 1.5, 0.76, 0.92
    bezier = hyprnostretch, 0.05, 0.9, 0.1, 1.0
    bezier = fluent_decel, 0.1, 1, 0, 1
    bezier = easeInOutCirc, 0.85, 0, 0.15, 1
    bezier = easeOutCirc, 0, 0.55, 0.45, 1
    bezier = easeOutExpo, 0.16, 1, 0.3, 1
    bezier = softAcDecel, 0.26, 0.26, 0.15, 1
    # Animation configs
    animation = windows, 1, 3, md3_decel, popin 60%
    animation = border, 1, 10, default
    animation = fade, 1, 2.5, md3_decel
    # animation = workspaces, 1, 3.5, md3_decel, slide
    animation = workspaces, 1, 7, fluent_decel, slide
    # animation = workspaces, 1, 2.5, softAcDecel, slide
    # animation = workspaces, 1, 7, fluent_decel, slidefade 15%
    # animation = specialWorkspace, 1, 3, md3_decel, slidefadevert 15%
    animation = specialWorkspace, 1, 3, md3_decel, slidevert
}

misc {
    vfr = true
    vrr = true
    # layers_hog_mouse_focus = true
    focus_on_activate = true
    animate_manual_resizes = false
    animate_mouse_windowdragging = true
    enable_swallow = false
    swallow_regex = (foot|kitty|allacritty|Alacritty)

    disable_hyprland_logo = true
    force_default_wallpaper = 0
    new_window_takes_over_fullscreen = 2
}

xwayland:force_zero_scaling = true
