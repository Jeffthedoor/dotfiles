# Bar, wallpaper
# exec-once = swww kill; swww init
exec-once = hyprpaper
exec-once = hyprpanel &

# Input method
exec-once = fcitx5

# Core components (authentication, lock screen, notification daemon)
exec-once = systemctl --user start hyprpolkitagent
exec-once = hypridle
exec-once = dbus-update-activation-environment --all
exec-once = sleep 1 && dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP

# Clipboard: history
exec-once = wl-paste --watch cliphist store
#exec-once = rofi -modi clipboard:/path/to/cliphist-rofi-img -show clipboard -show-icons

# Cursor
exec-once = hyprctl setcursor Nordzy-hyprcursors-catppuccin-frappe-dark 24

# login
exec-once = hyprlock
exec-once = xdotool key enter

# apps
#exec-once = /home/jusno/Documents/utils/services/desdeskthing-linux-0.11.17-setup.AppImage
#exec-once = /usr/bin/kdeconnect-indicator
exec-once = spotify --minimized
